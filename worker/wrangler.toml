name = "mac-kit-paddle-webhook"
main = "src/paddle-webhook.js"
compatibility_date = "2026-07-05"

[vars]
PADDLE_SIGNATURE_TOLERANCE_SECONDS = "300"
LIFETIME_PRICE_ID = "pri_01kyj2qr6c0azepvamn2zc34sh"
MONTHLY_PRICE_ID = "pri_01kws963debaa0y28k1m93syc9"
YEARLY_PRICE_ID = "pri_01kwsv2vs7ek3s48fnyvena2yf"
PADDLE_ENVIRONMENT = "live"
LICENSE_ACTIVATION_LIMIT = "1"
MAC_KIT_DOWNLOAD_URL = "https://github.com/mahsumozer/mac-kit-releases/releases/latest"
LICENSE_EMAIL_FROM = "Mac Kit <license@usemackit.com>"
LICENSE_EMAIL_REPLY_TO = "hello@usemackit.com"
MIN_SUPPORTED_VERSION = "1.17.12"
TRIAL_DURATION_DAYS = "7"

[[kv_namespaces]]
binding = "PADDLE_EVENTS"
id = "3a415125c7894a349ea433875f2c20e7"

[[ratelimits]]
name = "TRIAL_START_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mac Kit · Output</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="social.css" />
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="auto.css" />
    <link rel="stylesheet" href="out.css" />
  </head>
  <body class="hub-body">
    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <header class="hub-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </span>
        <span>Mac Kit</span>
      </a>
      <span class="hub-title">Output</span>
      <nav class="hub-nav">
        <a class="hub-nav-link" href="index.html">Queue</a>
        <a class="hub-nav-link" href="studio.html">Studio</a>
        <a class="hub-nav-link" href="auto.html">Autopilot</a>
        <a class="hub-nav-link" href="cut.html">Supercut</a>
        <a class="hub-nav-link is-current" href="out.html">Output</a>
        <a class="hub-nav-link" href="editor.html">Editor</a>
      </nav>
      <span class="server-pill" id="server-pill" data-state="checking">Checking server…</span>
    </header>

    <main class="hub-main out-main">
      <section class="out-head">
        <div>
          <h1 class="out-title">Everything you have made</h1>
          <p class="out-sub" id="out-count">Reading the output folder…</p>
        </div>
        <div class="btn-row">
          <label class="auto-knob">
            Show
            <select id="out-filter">
              <option value="all" selected>Everything</option>
              <option value="video">Videos</option>
              <option value="image">Carousels</option>
            </select>
          </label>
          <button class="button button-ghost button-small" id="out-reveal" type="button">Open the folder</button>
          <button class="button button-dark button-small" id="out-refresh" type="button">Refresh</button>
        </div>
      </section>

      <div class="auto-grid" id="out-grid"></div>
    </main>

    <div class="out-lightbox" id="out-lightbox" hidden>
      <button class="out-lightbox-close" id="out-lightbox-close" type="button" aria-label="Close">✕</button>
      <div class="out-lightbox-body" id="out-lightbox-body"></div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="out.js"></script>
  </body>
</html>

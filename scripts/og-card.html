<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #050505;
        --paper: #f4f2ed;
        --muted: #6d6b66;
        --soft-black: rgba(5, 5, 5, 0.66);
        --accent: #f5941d;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 58px 0 58px 68px;
        display: flex;
        align-items: center;
        gap: 40px;
        overflow: hidden;
      }

      .copy {
        position: relative;
        z-index: 2;
        width: 600px;
        flex: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 34px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--ink);
        color: var(--paper);
      }

      .brand-name {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .eyebrow em {
        color: var(--accent);
        font-style: normal;
      }

      h1 {
        margin: 0;
        font-size: 68px;
        font-weight: 760;
        line-height: 0.88;
        letter-spacing: -0.075em;
      }

      .lede {
        max-width: 520px;
        margin: 26px 0 0;
        color: var(--soft-black);
        font-size: 20px;
        line-height: 1.42;
        letter-spacing: -0.035em;
      }

      .domain {
        position: absolute;
        left: 68px;
        bottom: 52px;
        z-index: 2;
        color: var(--muted);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .shot {
        position: absolute;
        top: 96px;
        left: 700px;
        width: 620px;
        height: 534px;
        border-radius: 20px 0 0 0;
        overflow: hidden;
        border: 1px solid rgba(5, 5, 5, 0.14);
        border-right: 0;
        border-bottom: 0;
        box-shadow: 0 40px 90px rgba(5, 5, 5, 0.24);
        background: #0b0b0b;
      }

      .shot img {
        display: block;
        width: 980px;
        margin: -6px 0 0 -6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </span>
          <span class="brand-name">Mac Kit</span>
        </div>
        <p class="eyebrow">One-time $14.90 / <em>7-day free trial</em></p>
        <h1>Mac Kit turns the menu bar into a control center.</h1>
        <p class="lede">Screenshots, clipboard history, Pomodoro, color picker, converters and more — one fast, offline app.</p>
      </div>
      <p class="domain">usemackit.com</p>
      <div class="shot">
        <img src="../social-media-video/shot-home.png" alt="" />
      </div>
    </div>
  </body>
</html>

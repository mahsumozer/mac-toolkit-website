name = "mac-kit-forms"
main = "src/forms.js"
compatibility_date = "2026-07-31"

[vars]
MAC_KIT_DOWNLOAD_URL = "https://github.com/mahsumozer/mac-kit-releases/releases/latest"
SITE_URL = "https://usemackit.com"
FORM_EMAIL_FROM = "Mac Kit <hello@usemackit.com>"
FORM_EMAIL_REPLY_TO = "hello@usemackit.com"
HANDOFF_TEMPLATE_ID = "mac-kit-handoff"

[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
